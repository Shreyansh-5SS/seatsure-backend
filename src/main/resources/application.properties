# 1. Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/seatsure
spring.datasource.username=postgres
spring.datasource.password=database
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA & Hibernate Settings
# CRITICAL: We set this to 'validate' because Flyway is managing our schema now!
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true